name: repair-pr

on:
  push:
    branches: [feat/powerio-dc-operator-reuse]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'BurhanAbdullah'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/powerio-dc-operator-reuse
          fetch-depth: 0

      - name: Apply compile fix and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/tellegen/src/sens/conic.rs')
          text = path.read_text()
          old = 'let dd = *d;'
          new = 'let dd = d;'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one conic dimension binding, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Verify Rust build
        run: cargo check --workspace --all-targets

      - name: Commit source fixes
        run: |
          git config user.name 'BurhanAbdullah'
          git config user.email '131237388+BurhanAbdullah@users.noreply.github.com'
          git add crates/tellegen/src/lib.rs crates/tellegen/src/sens/conic.rs crates/tellegen/src/api_contract.rs crates/tellegen/src/canonical_dc_operators.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore CI build and formatting'
          git push origin HEAD:feat/powerio-dc-operator-reuse

      - name: Remove temporary repair workflow
        if: always()
        run: |
          git config user.name 'BurhanAbdullah'
          git config user.email '131237388+BurhanAbdullah@users.noreply.github.com'
          git rm -f .github/workflows/repair-pr.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove temporary repair workflow'
          git push origin HEAD:feat/powerio-dc-operator-reuse
